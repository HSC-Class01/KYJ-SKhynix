name: DART Update & GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "docs/**"
      - "README.md"
  schedule:
    - cron: "0 1 1 * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate DART API secret
        shell: bash
        run: |
          test -n "$DART_API_KEY" || { echo "::error::DART_API_KEY secret is missing."; exit 1; }
          test "${#DART_API_KEY}" -eq 40 || { echo "::error::DART_API_KEY must be 40 characters."; exit 1; }
      - name: Collect DART financial data
        run: python update_data.py
      - name: Validate collected data
        run: |
          test -s data/financial_metrics.csv || { echo "::error::financial_metrics.csv was not created."; exit 1; }
          python -c "import pandas as pd; d=pd.read_csv('data/financial_metrics.csv'); assert not d.empty, 'DART collection returned no financial rows'; print(f'Collected {len(d):,} financial rows across {d.year.nunique()} years.')"
      - name: Build dashboard
        run: python build_dashboard.py
      - name: Commit updated data and dashboard
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/index.html
          if git diff --cached --quiet; then echo "No repository changes detected."; else git commit -m "chore: update SK hynix DART data"; git push; fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4