# Account aliases used by the DART normalizer.
# Add/remove aliases as needed for future filings.
metrics:
  revenue:
    label: 매출액
    statement: IS
    aliases: [매출액, 수익(매출액), 영업수익, 매출]
  cost_of_sales:
    label: 매출원가
    statement: IS
    aliases: [매출원가]
  gross_profit:
    label: 매출총이익
    statement: IS
    aliases: [매출총이익]
  operating_income:
    label: 영업이익
    statement: IS
    aliases: [영업이익, 영업이익(손실)]
  net_income:
    label: 당기순이익
    statement: IS
    aliases: [당기순이익, 당기순이익(손실), 분기순이익, 반기순이익]
  total_assets:
    label: 자산총계
    statement: BS
    aliases: [자산총계]
  current_assets:
    label: 유동자산
    statement: BS
    aliases: [유동자산]
  cash:
    label: 현금및현금성자산
    statement: BS
    aliases: [현금및현금성자산, 현금및현금성자산(현금성자산포함)]
  inventory:
    label: 재고자산
    statement: BS
    aliases: [재고자산]
  total_liabilities:
    label: 부채총계
    statement: BS
    aliases: [부채총계]
  current_liabilities:
    label: 유동부채
    statement: BS
    aliases: [유동부채]
  total_equity:
    label: 자본총계
    statement: BS
    aliases: [자본총계]
  ppe:
    label: 유형자산
    statement: BS
    aliases: [유형자산]
  operating_cash_flow:
    label: 영업활동현금흐름
    statement: CF
    aliases: [영업활동으로 인한 현금흐름, 영업활동현금흐름]
